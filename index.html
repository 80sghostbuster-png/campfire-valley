const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const fitHooks=[];
function fit(){

}
const tpx=css=>css/CSSPL; // css px -> logical px

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

 const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return lerp(lerp(a,b,u),lerp(c,d,u),v);}
const fmt=n=>{n=Math.floor(n);return n>=100000?(n/1000|0)+'K':String(n);};

}

 x+=padStick.x;y+=padStick.y;x+=stick.vx;y+=stick.vy;

function endFrameInput(){for(const k in pressed)pressed[k]=false;typed.length=0;ptr.wheel=0;ptr.began=false;ptr.ended=false;ptr.dragFrame=0;}

let tapWorld=()=>{};

const toasts=[];
function toast(msg,col,dur){toasts.push({m:msg,t:0,d:dur||2.4,c:col||'#fff'});if(toasts.length>4)toasts.shift();}

const rgb=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
function shade(h,f){const[r,g,b]=hexRGB(h);return f<0?rgb(r*(1+f),g*(1+f),b*(1+f)):rgb(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f);}
const OUT='#1a1424';
function outl(c,col){const w=c.width,h=c.height,g=c.getContext('2d'),d=g.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a);const[R,G,B]=hexRGB(col||OUT);

  if((x>0&&a[i-1]>40)||(x<w-1&&a[i+7]>40)||(y>0&&a[i-w*4+3]>40)||(y<h-1&&a[i+w*4+3]>40)){o[i]=R;o[i+1]=G;o[i+2]=B;o[i+3]=255;}}

const tcache=new Map();
function textCanvas(s,col,sh){const key=s+'\u0001'+col+'\u0001'+(sh||'');let c=tcache.get(key);if(c)return c;
 if(tcache.size>700)tcache.clear();

 const paint=(oy,cl)=>{for(let i=0;i<s.length;i++){const gl=FG[s[i]];if(!gl)continue;g.fillStyle=cl;for(let y=0;y<7;y++)for(let x=0;x<5;x++)if(gl[y][x]==='#')g.fillRect(1+i*6+x,1+y+oy,1,1);}};

const nt=s=>String(s).toUpperCase();

function txt(s,x,y,sc,col,al,sh){sc=sc||1;s=nt(s);const c=textCanvas(s,col||'#fff',sh);const w=c.width*sc;const dx=al==='c'?x-(w-2*sc)/2:al==='r'?x-(w-2*sc):x;ctx.drawImage(c,Math.round(dx)-sc,Math.round(y)-sc,w,c.height*sc);return w;}
// wrap text to width (logical px at scale sc)

// ---------- pixel drawing helpers ----------
function S(w,h,fn,ol){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 const p={g,w,h,
  r(x,y,ww,hh,col){if(ww<=0||hh<=0)return;g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(ww),Math.round(hh));},
  p(x,y,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),1,1);},
  line(x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);g.fillStyle=col;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let k=0;k<500;k++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}},

 };

const wcache=new WeakMap();
function whiteOf(c){let w=wcache.get(c);if(w)return w;w=document.createElement('canvas');w.width=c.width;w.height=c.height;const g=w.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,w.width,w.height);wcache.set(c,w);return w;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function pcirc(cx,cy,r,col){ctx.fillStyle=col;for(let y=-r;y<=r;y++){const xx=Math.floor(Math.sqrt(Math.max(0,r*r+r*.5-y*y)));ctx.fillRect(Math.round(cx-xx),Math.round(cy+y),xx*2+1,1);}}

// ---------- ui panels ----------
const UI={bg:'#3b2615',bg2:'#5a3a20',gold:'#f2c14e',goldD:'#b8862a',ink:'#1a1424',sel:'#f2c14e',txt:'#fff6dc',dim:'#b9a583',good:'#7be06a',bad:'#ff6a5a',cream:'#f7ead0'};
function panel(x,y,w,h,o){o=o||{};x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);const bg=o.bg||UI.bg,bd=o.bd||UI.gold;

// ---------- audio ----------
const AU={ctx:null,master:null,sfxG:null,musG:null,muted:false,vol:.7,mvol:.5,mode:'none',next:0,step:0,bar:0,seed:1};
function auUnlock(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.muted?0:1;AU.master.connect(AU.ctx.destination);
  AU.sfxG=AU.ctx.createGain();AU.sfxG.gain.value=AU.vol*.5;AU.sfxG.connect(AU.master);AU.musG=AU.ctx.createGain();AU.musG.gain.value=AU.mvol*.35;AU.musG.connect(AU.master);
  AU.noiseBuf=AU.ctx.createBuffer(1,AU.ctx.sampleRate,AU.ctx.sampleRate);const d=AU.noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AU.ctx=null;}}
function setMute(m){AU.muted=m;if(AU.master)AU.master.gain.value=m?0:1;if(typeof SV!=='undefined'&&SV&&SV.set)SV.set.mute=m;}

// music: simple generative loop (pentatonic over a 4-chord progression); modes: title, day, night
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[0,4,7],[9,0,4],[5,9,0],[7,11,2]],ROOT=[48,45,41,43];
const PENT=[0,2,4,7,9];
function musicMode(m){if(AU.mode===m)return;AU.mode=m;AU.step=0;AU.bar=0;if(AU.ctx)AU.next=AU.ctx.currentTime+.1;}
function musicTick(){const a=AU.ctx;if(!a||AU.muted||AU.mode==='none')return;if(AU.next<a.currentTime-.5)AU.next=a.currentTime+.05;
 const sd=AU.mode==='night'?.34:AU.mode==='title'?.24:.26;
 while(AU.next<a.currentTime+.25){const st=AU.step%16,bar=Math.floor(AU.step/16),ch=bar%4,t=AU.next-a.currentTime;
  const rr=mulberry(bar*977+st*131+(AU.mode==='title'?7:AU.mode==='night'?3:1));
  const rt=ROOT[ch];
  if(AU.mode==='title'){ // campfire arpeggio + melody
   if(st%2===0){const n=rt+12+PROG[ch][(st/2)%3|0];tone(NOTE(n),.5,'triangle',.22,0,t,AU.musG);}
   if(st===0||st===8)tone(NOTE(rt-12),.9,'sine',.3,0,t,AU.musG);
   if(st%4===0&&rr()<.8){const n=rt+24+PENT[Math.floor(rr()*5)]+(rr()<.3?12:0);tone(NOTE(n),.45,'square',.06,0,t,AU.musG);}
  }else if(AU.mode==='day'){
   if(st%4===0)tone(NOTE(rt-12),.6,'sine',.3,0,t,AU.musG);
   if(st%2===1||st%4===0){const n=rt+12+PROG[ch][Math.floor(rr()*3)];if(rr()<.55)tone(NOTE(n),.28,'triangle',.18,0,t,AU.musG);}
   if(st%2===0&&rr()<.5){const n=rt+24+PENT[Math.floor(rr()*5)];tone(NOTE(n),.3,'square',.045,0,t,AU.musG);}
  }else{ // night: slow pads + sparse bells
   if(st%8===0){PROG[ch].forEach(n=>tone(NOTE(rt+n),2.4,'sine',.1,0,t,AU.musG));}
   if(st%4===2&&rr()<.6){tone(NOTE(rt+36+PENT[Math.floor(rr()*5)]),.9,'sine',.07,0,t,AU.musG);}
  }
  AU.step++;AU.next+=sd;}}

function roomsConnected(rooms){if(!rooms.length)return true;const seen=new Set([0]),q=[0];while(q.length){const a=rooms[q.pop()];rooms.forEach((b,j)=>{if(seen.has(j))return;const touch=(a.x<=b.x+b.w&&b.x<=a.x+a.w&&a.y<=b.y+b.h&&b.y<=a.y+a.h)&&!((a.x+a.w<=b.x&&(a.y+a.h<=b.y||b.y+b.h<=a.y))||(b.x+b.w<=a.x&&(a.y+a.h<=b.y||b.y+b.h<=a.y)));

  const hx=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),hy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);

 // nametag when close

function drawPlayer(t){const x=sx_(P.x),y=sy_(P.y);ctx.drawImage(OBJ.shadow,x-8,y-5);
 let fr=0;if(P.moving)fr=(Math.floor(P.wt*7)%2)?1:2;if(P.actT>0||P.fish&&(P.fish.st==='reel'||P.fish.st==='cast'||P.fish.st==='bite'))fr=3;

  ctx.save();ctx.translate(x+fv[0]*7+(P.dir===1?4:P.dir===0?-4:0),y-13+fv[1]*4);const sgn=P.dir===2?-1:1;ctx.rotate(a*sgn*(P.dir===1||P.dir===0?1:1)+(P.dir===2?.3:P.dir===3?-.3:0));ctx.drawImage(ic,-3,-12);ctx.restore();}

function drawFishing(x,y,t){const f=P.fish;const bx=sx_(f.bx),by=sy_(f.by);
 const tipx=x+DIRV[P.dir][0]*10,tipy=y-24;
 if(f.st==='cast'||f.st==='wait'||f.st==='bite'||f.st==='reel'){

  const sx2=Math.round(x+dv[0]*13+(P.dir>=2?0:4)),sy2=Math.round(y-25);
  const bob=f.st==='bite'?Math.round(Math.sin(t*40)*1.5):f.st==='wait'?Math.round(Math.sin(t*4)):0;
  const ex=f.st==='cast'?lerp(sx2,bx,f.k):bx,ey=(f.st==='cast'?lerp(sy2,by,f.k)-Math.sin(f.k*3.14)*18:by)+bob+(f.st==='bite'?2:0);
  // line
  ctx.fillStyle='rgba(255,255,255,.75)';const n=16;for(let i=0;i<=n;i++){const u=i/n,lx=lerp(sx2,ex,u),ly=lerp(sy2,ey,u)+Math.sin(u*3.14)*(f.st==='reel'?2:4);ctx.fillRect(Math.round(lx),Math.round(ly),1,1);}
  if(f.st!=='cast'||f.k>.95){ctx.fillStyle=OUT;ctx.fillRect(Math.round(ex)-2,Math.round(ey)-2,4,5);ctx.fillStyle='#ff4a4a';ctx.fillRect(Math.round(ex)-1,Math.round(ey)-2,2,2);ctx.fillStyle='#fff';ctx.fillRect(Math.round(ex)-1,Math.round(ey),2,2);
   if(f.st==='wait'||f.st==='bite'){ctx.strokeStyle='rgba(255,255,255,.5)';const r=2+((t*6)%4);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(Math.round(ex)-r,Math.round(ey)+2,r*2,1);}}

// ---------- day / night ----------
let nightC=null,nightG=null;
function daylight(){const h=hour()%24;const hh=SV.min/60;
 // returns [alpha, r,g,b]
 let a=0,c=[18,22,80];
 if(hh<5)a=.6;else if(hh<7){a=lerp(.6,0,(hh-5)/2);c=[lerp(18,255,(hh-5)/2*.5),lerp(22,140,(hh-5)/2*.5),lerp(80,90,(hh-5)/2*.5)];}
 else if(hh<17)a=0;else if(hh<19.5){const u=(hh-17)/2.5;a=lerp(0,.3,u);c=[lerp(255,60,u),lerp(150,40,u),lerp(60,100,u)];}
 else if(hh<21){const u=(hh-19.5)/1.5;a=lerp(.3,.58,u);c=[lerp(60,18,u),lerp(40,22,u),lerp(100,80,u)];}
 else a=.6;
 return[a,c];}
function lightSources(){const L=[];const x0=CAM.x-40,x1=CAM.x+VW+40,y0=CAM.y-40,y1=CAM.y+VH+40;
 const add=(x,y,r)=>{if(x>x0&&x<x1&&y>y0&&y<y1)L.push([x,y,r]);};
 for(const d of decos)if(d.k==='lamp')add(d.x*16+8,d.y*16,44);
 for(const b of bldgs){const night=hour()>=18||hour()<6.5;if(night){const dx=(b.x+b.dx+.5)*16+0,dy=(b.y+b.h)*16-8;add(dx,dy,18);}}
 if(SV.tent){for(const y of SV.home.yard){if(y.k==='camp')add(y.x*16+8,y.y*16+8,52);else if(y.k==='lamp')add(y.x*16+8,y.y*16,46);}
  for(const f of SV.home.furn){if(f.k==='lamp')add(f.x*16+8,f.y*16+8,44);else if(f.k==='fire')add(f.x*16+16,f.y*16+12,50);else if(f.k==='stove'&&cookAnim>0)add(f.x*16+8,f.y*16+8,30);}
  const m=SV.home.rooms;if(m.length&&hour()>=18||hour()<6)for(const r of m)add((r.x+r.w/2)*16,(r.y+r.h/2)*16,r.w*8+8);}
 add(P.x,P.y-10,32);
 return L;}
function pcircG(g,cx,cy,r){for(let y=-r;y<=r;y++){const xx=Math.floor(Math.sqrt(Math.max(0,r*r+r*.5-y*y)));g.fillRect(Math.round(cx-xx),Math.round(cy+y),xx*2+1,1);}}
function drawNight(){const[a,c]=daylight();if(a<=.01)return;
 if(!nightC||nightC.width!==VW||nightC.height!==VH){nightC=document.createElement('canvas');nightC.width=VW;nightC.height=VH;nightG=nightC.getContext('2d');}
 const g=nightG;g.globalCompositeOperation='source-over';g.clearRect(0,0,VW,VH);g.fillStyle='rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')';g.fillRect(0,0,VW,VH);
 if(a>.12){g.globalCompositeOperation='destination-out';for(const l of lightSources()){const x=Math.round(l[0]-CAM.x),y=Math.round(l[1]-CAM.y);for(let k=0;k<4;k++){g.fillStyle='rgba(0,0,0,'+(.3+k*.04)+')';pcircG(g,x,y,Math.round(l[2]*(1-k*.2)));}}}
 ctx.drawImage(nightC,0,0);
 if(a>.2){ // warm glow additive near lights
  ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,170,60,.07)';for(const l of lightSources()){if(l[2]>=30)pcirc(Math.round(l[0]-CAM.x),Math.round(l[1]-CAM.y),Math.round(l[2]*.6),'rgba(255,170,60,.06)');}ctx.globalCompositeOperation='source-over';}
}
function drawParticles(){for(const p of parts){const a=p.fade?clamp(p.life/(p.max*.6),0,1):1;ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-CAM.x),Math.round(p.y-CAM.y),p.sz,p.sz);}ctx.globalAlpha=1;
 for(const f of floats){ctx.globalAlpha=clamp(1.5-f.t,0,1);txt(f.s,Math.round(f.x-CAM.x),Math.round(f.y-CAM.y),1,f.col,'c');}ctx.globalAlpha=1;}

 P.x=SV.px;P.y=SV.py;P.dir=SV.face||0;P.fish=null;P.busy=0;P.cool=0;P.actT=0;P.tool=null;P.dance=0;parts.length=0;drops.length=0;floats.length=0;falling.length=0;treeHp.clear();toasts.length=0;
 computeHome();if(SV.tent){SV.maxH=calcMaxH();}nudgePlayer();buildEnts();G.modal=null;G.dayBanner=null;G.report=null;G.fade={a:1,to:0,spd:2.2,cb:null};
 if(!SV.wants.list.length||SV.wants.day!==SV.day)newDayEconomy();
 runTimers(absMin());camTo(P.x,P.y-6,true);touchUIOn=true;G.mode=SV.tent?'play':'tent';musicMode(hour()>=19||hour()<5.5?'night':'day');G.autosaveT=0;
 if(isNew){openDialog('',['Welcome to Campfire Valley, '+SV.name+'!','Wander and find a spot you love: by the river for fishing, in the woods for logging, a meadow for farming, or near rocks for mining.','Face the direction you want the tent and press A to pitch it. You can camp anywhere on open ground.']);}
 else if(SV.tent){toast('Welcome back, '+SV.name+'!','#9be08a');}
 for(const k in held)held[k]=false;}
// ---------- play update ----------
function simPlay(dt,input){
 if(P.fish&&!input){}
 const free=!G.modal&&!fading();
 if(free){
  if(input)playInput(dt);
  movePlayer(dt);
  P.cool=Math.max(0,P.cool-dt);if(P.busy>0){P.busy-=dt;if(P.dance>0)P.dance-=dt;if(P.busy<=0){P.dance=0;P.busy=0;}}
  if(P.actT>0){P.actT-=dt;if(!P.hit&&P.tool&&P.actT<=P.actD*.5){P.hit=true;toolHit(P.tool);}if(P.actT<=0){P.actT=0;P.tool=null;}}
  updateFishing(dt);
  if(SV.hearts<SV.maxH&&!P.fish&&P.actT<=0){SV.hearts=Math.min(SV.maxH,SV.hearts+dt*(P.moving?.004:.02));}
  SV.min+=dt*MIN_PER_SEC;SV.playMin=(SV.playMin||0)+dt/60;if(cookAnim>0)cookAnim-=dt;
  G.tick=(G.tick||0)+dt;if(G.tick>2){G.tick=0;runTimers(absMin());}
  if(SV.min>=1560&&!fading()){toast('You are exhausted...','#ffb0a0');sleepToMorning(true);}
  updateEnts(dt);updateParticles(dt);
  updatePrompt();
  G.autosaveT+=dt;if(G.autosaveT>45){G.autosaveT=0;saveGame(true);}
 }else if(!G.modal){updateParticles(dt);}
 if(!G.modal&&!fading()&&G.report){showReport();}
 if(G.babyBorn){sfx('fanfare');G.flash=.6;G.babyBorn=null;}
 camUpdate(dt,P.x,P.y);
 const m=hour()>=19||hour()<5.5?'night':'day';if(m!==AU.mode&&AU.mode!=='title')musicMode(m);if(AU.mode==='title'&&G.mode==='play')musicMode(m);
}
function drawModal(){const m=G.modal;if(!m)return;switch(m.type){case'list':drawList(m);break;case'dialog':drawDialog(m);break;case'confirm':drawConfirm(m);break;case'radial':drawRadial(m);break;case'map':drawMap(m);break;case'kbd':drawKbd(m);break;}}

 if(G.mode==='play'){const wx=t.x+CAM.x,wy=t.y+CAM.y;let best=null,bd=18;for(const e of ents){if(e.inside)continue;const d=Math.hypot(e.x-wx,(e.y-8)-wy);if(d<bd&&Math.hypot(e.x-P.x,e.y-P.y)<44){bd=d;best=e;}}

};
let lastTs=0;

function stepFrame(dt){G.dt=dt;G.t+=dt;G.frame++;hits=[];
